name: CI
on:
    pull_request:
        branches: [main]
concurrency:
    group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true
permissions:
    contents: read
jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            flip-zoo: ${{ steps.paths.outputs.flip-zoo }}
            mahjong-match: ${{ steps.paths.outputs.mahjong-match }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - id: paths
              name: Detect changed project paths
              shell: bash
              env:
                  PR_BASE: ${{ github.event.pull_request.base.sha }}
                  PR_HEAD: ${{ github.event.pull_request.head.sha }}
              run: |
                  changed() {
                      local check="$1" status
                      shift
                      if git diff --quiet --no-renames --no-ext-diff "$PR_BASE...$PR_HEAD" -- "$@"; then
                          printf '%s=false\n' "$check" >> "$GITHUB_OUTPUT"
                      else
                          status=$?
                          if [[ "$status" -ne 1 ]]; then
                              return "$status"
                          fi
                          printf '%s=true\n' "$check" >> "$GITHUB_OUTPUT"
                      fi
                  }
                  shared=(.github/workflows/ .editorconfig .oxlintrc.json .prettierrc.json .prettierignore)
                  changed flip-zoo frontend/miniprograms/flip-zoo/ "${shared[@]}"
                  changed mahjong-match frontend/miniprograms/mahjong-match/ "${shared[@]}"
    tooling:
        needs: changes
        if: always() && !cancelled()
        runs-on: ubuntu-latest
        steps:
            - name: Require successful path detection
              env:
                  DETECTION_RESULT: ${{ needs.changes.result }}
              run: test "$DETECTION_RESULT" = success
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: package-lock.json
            - run: npm ci
            - name: Repository format (4 spaces)
              run: npm run format:check
            - name: Tool lint
              run: npm run lint
            - name: Structure and review helper tests
              run: npm test
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - run: python -m pip install -r requirements-dev.txt
            - run: ruff check scripts
            - run: ruff format --check scripts
    flip-zoo:
        # Check names are also registered in .github/main-protection.json.
        name: miniprogram
        needs: changes
        if: needs.changes.outputs.flip-zoo == 'true'
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend/miniprograms/flip-zoo
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: frontend/miniprograms/flip-zoo/package-lock.json
            - run: npm ci
            - run: npm run typecheck
            - run: npm test
            - run: npm run lint
            - run: npm run format:check
    mahjong-match:
        name: miniprogram (mahjong-match)
        needs: changes
        if: needs.changes.outputs.mahjong-match == 'true'
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend/miniprograms/mahjong-match
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: frontend/miniprograms/mahjong-match/package-lock.json
            - run: npm ci
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run format:check
