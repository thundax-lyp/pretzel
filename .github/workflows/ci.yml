name: CI
on:
    pull_request:
        branches: [main]
concurrency:
    group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true
permissions:
    contents: read
jobs:
    admin:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend/admin
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: frontend/admin/package-lock.json
            - run: npm ci
            - run: npm run format:check
            - run: npm run lint
            - run: npm test
            - run: npm run build
    tooling:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: frontend/admin/package-lock.json
            - run: npm ci --prefix frontend/admin
            - name: Repository format (4 spaces)
              run: node scripts/check-format.mjs
            - name: Tool lint
              run: frontend/admin/node_modules/.bin/oxlint --config .oxlintrc.json --deny-warnings scripts .agents
            - name: Structure and review helper tests
              run: node --test scripts/*.test.mjs
            - name: Level design skill tests
              run: node --test .agents/skills/pretzel-level-design/scripts/*.test.mjs
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - run: python -m pip install -r requirements-dev.txt
            - run: ruff check scripts
            - run: ruff format --check scripts
    miniprogram:
        name: ${{ matrix.check-name }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - game: flip-zoo
                      check-name: miniprogram
                      run-tests: true
                    - game: mahjong-match
                      check-name: miniprogram (mahjong-match)
                      run-tests: false
        defaults:
            run:
                working-directory: frontend/miniprograms/${{ matrix.game }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: frontend/miniprograms/${{ matrix.game }}/package-lock.json
            - run: npm ci
            - run: npm run typecheck
            - if: matrix.run-tests
              run: npm test
            - run: npm run lint
            - run: npm run format:check
