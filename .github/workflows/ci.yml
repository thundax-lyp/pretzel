name: CI
on:
    push:
    pull_request:
        branches: [main]
    workflow_dispatch:
concurrency:
    group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
    cancel-in-progress: true
permissions:
    contents: read
jobs:
    admin:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: admin-web
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: admin-web/package-lock.json
            - run: npm ci
            - name: Repository format (4 spaces)
              run: node ../scripts/check-format.mjs
            - name: Tool lint
              working-directory: ${{ github.workspace }}
              run: admin-web/node_modules/.bin/oxlint --config .oxlintrc.json --deny-warnings scripts .agents
            - run: npm run format:check
            - run: npm run lint
            - name: Structure and review helper tests
              run: node --test ../scripts/*.test.mjs
            - run: npm test
            - run: npm run build
    backend:
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_DATABASE: pretzel_test
                    MYSQL_ROOT_PASSWORD: ci-test-only
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h localhost -pci-test-only"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=12
            redis:
                image: redis:7.2
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd="redis-cli ping"
                    --health-interval=5s
                    --health-timeout=3s
                    --health-retries=12
        env:
            TEST_REDIS_URL: redis://127.0.0.1:6379/15
            TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/pretzel_test?serverTimezone=Asia/Shanghai
            TEST_DB_USERNAME: root
            TEST_DB_PASSWORD: ci-test-only
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
            - run: ./mvnw -B clean verify
    tooling:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - run: python -m pip install -r requirements-dev.txt
            - run: ruff check scripts deploy
            - run: ruff format --check scripts deploy
            - run: sh -n scripts/infra-tunnel.sh
    miniprogram:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: miniprogram
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: miniprogram/package-lock.json
            - run: npm ci
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run format:check
