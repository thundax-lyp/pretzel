server:
    port: ${SERVER_PORT:8080}
    servlet:
        context-path: /pretzel-admin-api
spring:
    application:
        name: pretzel-admin
    datasource:
        url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/pretzel?serverTimezone=Asia/Shanghai}
        username: ${DB_USERNAME:pretzel}
        password: ${DB_PASSWORD}
    redis:
        url: ${REDIS_URL:redis://127.0.0.1:6379/0}
        password: ${REDIS_PASSWORD:}
    data:
        redis:
            url: ${REDIS_URL:redis://127.0.0.1:6379/0}
            password: ${REDIS_PASSWORD:}
    servlet:
        multipart:
            max-file-size: 5MB
            max-request-size: 5MB
jetcache:
    statIntervalMinutes: 15
    local:
        default:
            type: linkedhashmap
            keyConvertor: FASTJSON2
    remote:
        default:
            type: redis.lettuce
            keyConvertor: FASTJSON2
            uri: ${REDIS_URL:redis://127.0.0.1:6379/0}
management:
    endpoints:
        web:
            exposure:
                include: health
    endpoint:
        health:
            show-details: never
springdoc:
    api-docs:
        enabled: false
    swagger-ui:
        enabled: false
pretzel:
    bootstrap:
        enabled: ${PRETZEL_BOOTSTRAP_ENABLED:false}
    login:
        enable: true
        max-fail-count: 5
        lock-time: 900
    auth:
        login-expired-seconds: 1800
        captcha:
            whitelist-enabled: false
    oss:
        type: local
        local:
            root-path: ${STORAGE_PATH:storage}
    storage:
        bucket-name: local
        content-path: /pretzel-admin-api/api/storage/object/
